title: "SORTEE 2026 Hackathon — Data & Code in Society Journals"
description: "Question-by-question guide to the SORTEE 2026 hackathon form on data and code availability in ecology and evolution society journals."
url: "https://eivimeycook.github.io"
baseurl: "/Data-Code_Society"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "FAQ.md"
    values:
      permalink: "/"

exclude:
  - README.md
  - LICENSE
  - LICENSE-data.md
  - CITATION.cff
  - Data-Code_Society.Rproj
